services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lum010_qual
      POSTGRES_PASSWORD: ${LUM010_PG_PASSWORD:?disposable password required}
      POSTGRES_DB: lum010_qual
    ports:
      - "127.0.0.1:${LUM010_PG_PORT:?disposable port required}:5432"
    tmpfs:
      - /var/lib/postgresql/data:rw,size=4g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lum010_qual -d lum010_qual"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [qualification]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${LUM010_REDIS_PORT:?disposable port required}:6379"
    tmpfs:
      - /data:rw,size=64m
    networks: [qualification]

networks:
  qualification:
