name: Build plugins

on:
  push:
    branches: [ main ]
    paths:
      - 'plugins/**'
      - 'tests/**'
      - 'scripts/**'
      - 'release-sources.json'
      - 'runtime/**'
      - 'requirements-dev.txt'
      - 'requirements-edge.txt'
      - 'requirements-dj.txt'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - 'tests/**'
      - 'scripts/**'
      - 'release-sources.json'
      - 'runtime/**'
      - 'requirements-dev.txt'
      - 'requirements-edge.txt'
      - 'requirements-dj.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-plugins
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lumae_test
          POSTGRES_PASSWORD: disposable_ci_test
          POSTGRES_DB: lumae_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LUMAE_POSTGRES_TEST_DSN: postgresql://lumae_test:disposable_ci_test@localhost:5432/lumae_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-edge.txt
            requirements-dj.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-edge.txt

      - name: Compile plugin sources
        run: python -m compileall -q plugins scripts

      - name: Run plugin regression tests
        run: python -m pytest tests/plugins -q

      - name: Validate public release selection
        run: python scripts/build_catalog.py --check

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build zips, fill plugin.json, and the catalog
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: python scripts/build_catalog.py

      - name: Commit catalog, zips, and updated plugin.json files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist plugins manifest.json
          if git diff --cached --quiet; then
            echo "Catalog already up to date; nothing to commit."
          else
            git commit -m "Build plugin catalog [skip ci]"
            git push
          fi
